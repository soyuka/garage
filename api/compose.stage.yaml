---
# STAGE overlay — the conference rig. Layered ON TOP of the dev override, not instead of it:
#
#   docker compose --env-file .env.stage -f compose.yaml -f compose.override.yaml -f compose.stage.yaml up -d
#
# The dev override is kept deliberately. Its Vite dev server (`dashboard`) is what Caddy's @frontend
# proxies to, and the tunnel means we never need a production SPA build at all — that is one of the
# three blockers choosing the tunnel over a VPS deleted (CONFERENCE.md workstream A).
#
# Almost everything else is already parameterised through .env interpolation, so this file only
# carries what interpolation cannot reach.
services:
  php:
    environment:
      # The tunnel publishes this stack, so it never runs the dev kernel: APP_ENV=dev mounts the
      # profiler, whose /_profiler/phpinfo prints every API key, APP_SECRET and the Mercure secret, and
      # whose stored profiles keep the bearer tokens. The dev image and bind mount stay (the Vite
      # server is the Atelier); only the kernel changes. .env.dev is not read under prod: the two
      # values it carries (APP_SECRET, MCP_RESOURCE_ALIASES) are container env below.
      APP_ENV: prod
      APP_DEBUG: "0"
      XDEBUG_MODE: "off"
      # Symfony's Dotenv does not overwrite a variable that is already set in the environment, so a
      # value living only in .env.stage would lose to the `.env` bind-mounted at /app/.env. These
      # three must therefore be injected as container environment to actually win.
      CASDOOR_ISSUER: ${CASDOOR_ISSUER}
      APP_SECRET: ${APP_SECRET}
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-private_ranges}
      # Without the public host here, the MCP DNS-rebinding guard 403s every AUTHENTICATED request
      # with "Invalid Host header." while unauthenticated ones still 401 correctly — it reads
      # exactly like an OAuth failure. Must be container env: /app/.env's localhost-only default
      # would otherwise win, since Dotenv never overwrites an already-set variable.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS}
      # /mcp accepts only tokens whose `aud` is one of its resource URIs; the tunnel host is an alias of
      # DEFAULT_URI (https://localhost). Same container-env reasoning as above.
      MCP_RESOURCE_ALIASES: ${MCP_RESOURCE_ALIASES}
    # A prod kernel never checks its compiled container for freshness, and compose keeps the anonymous
    # /app/var volume across recreates, so a stale var/cache/prod would serve old code forever. tmpfs
    # makes every restart start cold; the entrypoint's `bin/console -V` warms it before Caddy starts.
    tmpfs: &stage_cache
      - /app/var/cache

  worker:
    tmpfs: *stage_cache
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      # The worker derives the same pilot topic and verifies the same tokens — if APP_SECRET differs
      # between php and worker, the two publish to DIFFERENT topics and half the frames vanish with
      # no error anywhere. Keep these in lockstep with php above.
      CASDOOR_ISSUER: ${CASDOOR_ISSUER}
      APP_SECRET: ${APP_SECRET}
