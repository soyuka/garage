---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      # No `watch`: the default watcher monitored /app recursively (incl. var/cache), so Symfony's
      # own compiled-container writes triggered worker reboots — each costing a ~5s cold recompile
      # that the dashboard's request burst stacked into 9-29s. Restart manually after code changes:
      # `docker compose restart php`.
      FRANKENPHP_WORKER_CONFIG: ""
      # No `hot_reload` either: FrankenPHP pushes the browser refresh through a Mercure hub declared
      # in the same Caddy server, and the hub now sits on the internal `php:80` site so that one hub
      # serves every SERVER_NAME address (frankenphp/Caddyfile). Provisioning fails outright with
      # "no Mercure hub configured" otherwise. Nothing is lost: with the watcher off above, the
      # refresh only ever reloaded the browser against a worker still serving the old code.
      FRANKENPHP_SITE_CONFIG: ""
      # Mercure 1.0 renamed `demo` to `playground`; its echo endpoints moved to /playground/.
      MERCURE_EXTRA_DIRECTIVES: playground
      # Caddy reverse-proxies @frontend requests here (the Atelier dev server on the compose network).
      FRONTEND_UPSTREAM: dashboard:5173
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    # Loopback only: the dev/stage stack runs the dev image (and, without the stage overlay, the dev
    # kernel). The cloudflared tunnel dials localhost:80, so it is unaffected; the LAN is not. !override
    # replaces compose.yaml's list instead of appending to it; prod keeps compose.yaml's binding.
    ports: !override
      - name: http
        host_ip: 127.0.0.1
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        host_ip: 127.0.0.1
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        host_ip: 127.0.0.1
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    depends_on:
      dashboard:
        condition: service_started
    tty: true

  # Same dev image, code bind-mount and ini as php, so the consumer runs the live source and the
  # same max_execution_time override is irrelevant here (CLI SAPI ignores it). APP_ENV follows .env.
  worker:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - /app/var
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"

  # Dashboard (Atelier) — Vite/React dev server, served same-origin behind Caddy at https://localhost.
  # Caddy's @frontend upstream. Dev-only (lives in the override): prod builds the SPA to static assets
  # instead of proxying. Context is ../dashboard (sibling of api/); node_modules is an anonymous volume
  # so the host tree never shadows the in-container install (arch-specific esbuild).
  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../dashboard:/app
      - /app/node_modules
    expose:
      - "5173"
    restart: unless-stopped

  # bonneref — the parts finder SPA (Vite/React), served same-origin behind Caddy at
  # https://localhost/bonneref/ (`handle /bonneref*` in frankenphp/Caddyfile). Same dev-only shape as
  # the dashboard service; Vite runs with base /bonneref/ so every asset and HMR path stays under it.
  bonneref:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../bonneref:/app
      - /app/node_modules
    expose:
      - "5173"
    restart: unless-stopped
