---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      # No `watch`: the default watcher monitored /app recursively (incl. var/cache), so Symfony's
      # own compiled-container writes triggered worker reboots — each costing a ~5s cold recompile
      # that the dashboard's request burst stacked into 9-29s. Restart manually after code changes:
      # `docker compose restart php`.
      FRANKENPHP_WORKER_CONFIG: ""
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: demo
      # Caddy reverse-proxies @frontend requests here (the dashboard service on the compose network).
      FRONTEND_UPSTREAM: dashboard:5173
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    depends_on:
      dashboard:
        condition: service_started
    tty: true

  # Same dev image, code bind-mount and ini as php, so the consumer runs the live source and the
  # same max_execution_time override is irrelevant here (CLI SAPI ignores it). APP_ENV follows .env.
  worker:
    image: ${IMAGES_PREFIX:-}app-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - /app/var
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"

  # Dashboard — Vite/React dev server, served same-origin behind Caddy at https://localhost.
  # Dev-only (lives in the override): prod builds the SPA to static assets instead of proxying.
  # Context is ../dashboard (sibling of api/); node_modules is an anonymous volume so the host
  # tree never shadows the in-container install (arch-specific esbuild binary).
  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ../dashboard:/app
      - /app/node_modules
    expose:
      - "5173"
    restart: unless-stopped
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432:5432"
###< doctrine/doctrine-bundle ###

###> doctrine/mongodb-odm-bundle ###
  mongodb:
    ports:
      - "${MONGODB_PORT:-27017}:27017"
###< doctrine/mongodb-odm-bundle ###
