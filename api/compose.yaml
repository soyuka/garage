---
services:
  php:
    restart: unless-stopped
    environment: &php_environment
      # Dev: set SERVER_NAME=http://localhost (in .env) to serve plain HTTP on :80 with no
      # TLS/redirect, so MCP clients without a trusted cert (Goose Flatpak's reqwest) reach
      # /mcp. The OAuth metadata + WWW-Authenticate challenge derive scheme/host from the
      # request, so http://localhost/mcp self-configures. DEFAULT_URI follows from .env.
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: ${DEFAULT_URI:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      # Postgres backs the DBAL HTTP caches (cache.siv, cache.partsapi) and Casdoor — NOT the
      # domain model, which now lives in MongoDB via Doctrine ODM (MONGODB_URL below).
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}
      # Domain store: the garage (vehicles, facts, maintenance records, planned tasks, users).
      # Built from components (like DATABASE_URL) so the host `mongodb` is always the compose
      # service name. Interpolating ${MONGODB_URL} would inherit .env's host-run value
      # (127.0.0.1) and break in-container connectivity.
      MONGODB_URL: mongodb://${MONGODB_HOST:-mongodb}:${MONGODB_PORT:-27017}
      MONGODB_DB: ${MONGODB_DB:-app}
      # Object store for maintenance bills. Override only the host: .env's 127.0.0.1 is the host-run
      # value, but inside the compose network the endpoint is the `minio` service name. The bucket +
      # credentials come straight from .env (read by the app's dotenv), identical in both contexts.
      S3_ENDPOINT: http://${MINIO_HOST:-minio}:9000
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      ###> dunglas/symfony-docker ###
      # Next lines are only used during initial installation
      # This block will remove itself after the installation
      SYMFONY_VERSION: ${SYMFONY_VERSION:-}
      STABILITY: ${STABILITY:-stable}
      ###< dunglas/symfony-docker ###
      ###> api-platform/api-platform ###
      CADDY_SERVER_EXTRA_DIRECTIVES: 'header ?Link `</docs.jsonld>; rel="http://www.w3.org/ns/hydra/core#apiDocumentation", </.well-known/mercure>; rel="mercure"`'
      ###< api-platform/api-platform ###
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    # CasdoorTokenHandler fetches the OIDC discovery doc + JWKS server-side to verify token
    # signatures. The issuer (CASDOOR_ISSUER) is also the token `iss`, so it must be ONE URL
    # that resolves identically here and on the host (Goose/browser). We use the bare service
    # name `casdoor`: this container resolves it via the compose network DNS, and the host
    # resolves it to loopback via an /etc/hosts entry (`127.0.0.1 casdoor`) reaching the
    # published :8000. (`casdoor.localhost` does NOT work: glibc hard-codes the .localhost TLD
    # to loopback inside the container, shadowing any extra_hosts mapping.)
    depends_on:
      casdoor:
        condition: service_started
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_started

  # Agent-turn consumer. Runs `messenger:consume` under the CLI SAPI (max_execution_time=0), so a
  # turn's full tool loop is unbounded — the 180s request limit that killed the in-request agent
  # is gone. Shares the php image and its whole environment (it calls the same agent: writes Mongo,
  # reads the Postgres HTTP caches, publishes render intents over Mercure). No ports: it consumes
  # the Doctrine queue, it does not serve HTTP. --time-limit recycles the worker so long-lived
  # leaks/stale metadata cannot accumulate; restart:unless-stopped brings it straight back.
  worker:
    restart: unless-stopped
    environment: *php_environment
    command: ["php", "bin/console", "messenger:consume", "async", "failed", "-vvv", "--time-limit=3600"]
    # The php image's HEALTHCHECK probes FrankenPHP's :2019/metrics, but this container only consumes
    # the queue (no HTTP server), so it would always report unhealthy. Override with a real liveness
    # check: the consumer process must be present. pgrep is unavailable (no procps in the image), so
    # scan /proc/<pid>/cmdline directly (NUL-separated, hence grep -a).
    healthcheck:
      test: ["CMD-SHELL", "grep -aqs messenger:consume /proc/[0-9]*/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      # php first: its entrypoint runs the DB migration. Waiting for it healthy means migration is
      # done before this container's own entrypoint runs it again (a no-op), so the two never race.
      php:
        condition: service_healthy
      database:
        condition: service_healthy
      mongodb:
        condition: service_healthy

# Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
