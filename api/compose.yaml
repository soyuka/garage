###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

###> doctrine/mongodb-odm-bundle ###
  # MongoDB — the domain store (Doctrine ODM). Holds the garage: vehicles, facts, maintenance
  # records, planned tasks and users. The HTTP upstream caches and Casdoor stay on Postgres.
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-app}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mongodb_data:/data/db
###< doctrine/mongodb-odm-bundle ###

  # MinIO — S3-compatible object store for maintenance bills (PDF/JPEG/PNG). The binaries live here;
  # the metadata stays in Mongo on the record. php/worker reach it by the service name `minio` over
  # the S3 async-aws client (config/services.yaml). Credentials are the dev defaults from .env —
  # insecure, externalise for prod (or point S3_* at a managed bucket and drop this service).
  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

  # One-shot: create the bills bucket on first boot (MinIO does not auto-create). Retries until the
  # server answers, makes the bucket if absent, then exits 0 — idempotent across `up`s.
  minio_init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} && mc ready local; do echo 'waiting for minio'; sleep 1; done;
      mc mb --ignore-existing local/${S3_BUCKET:-maintenance};
      exit 0"

  # Casdoor — OIDC authorization server protecting /mcp (and any future /api firewall).
  # Chosen over Zitadel because stock Goose (rmcp) self-registers via anonymous RFC 7591
  # Dynamic Client Registration, which Casdoor supports and Zitadel does not. Reuses the
  # Postgres container. NOTE: despite `dbName = casdoor` in app.conf, the tables land in the
  # `postgres` database — the pg driver uses dataSourceName's `dbname=postgres` and no `casdoor`
  # database is ever created (verified 2026-09-10; matters for backup/restore). Config lives
  # in docker/casdoor/app.conf — `origin` there MUST match the public URL so discovery
  # advertises the right authorization_endpoint (the production image serves the SPA on :8000,
  # unlike casdoor-all-in-one which splits it onto :7001 and breaks the browser redirect).
  #
  # One-time setup after first boot (see docs/AUTH.md): log in as the seeded admin
  # (built-in/admin / 123) and set Organization "built-in" → dcrPolicy = "open" to allow
  # Goose's anonymous client registration. Dev defaults are insecure; externalize for prod.
  #
  # init_data.json seeds the `dashboard` OAuth app (Authorization Code + PKCE public client) used
  # by the SPA. app.conf has initDataFile = "./init_data.json" and the binary's workdir is `/`, so
  # it is mounted at /init_data.json. Casdoor's InitDb() always creates the built-in org/app/admin
  # unconditionally, and init data is additive/idempotent (an object is created only if absent), so
  # this seed never clobbers the built-in objects — it just adds the dashboard app on first boot.
  casdoor:
    restart: unless-stopped
    image: casbin/casdoor:latest
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./docker/casdoor/app.conf:/conf/app.conf:ro
      - ./docker/casdoor/init_data.json:/init_data.json:ro
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${CASDOOR_PORT:-8000}:8000"

  # The Atelier's local voice (docs/voice-plan.md). Reached only when TTS_BACKEND=pockettts; the
  # container is inert otherwise, so it costs nothing but disk while ElevenLabs is selected.
  #
  # ONE CONTAINER PER LANGUAGE — `pocket-tts serve` binds a single model at process start. An English
  # twin is this block again with POCKET_TTS_LANGUAGE=english and POCKET_TTS_EN_URL pointed at it.
  #
  # No port mapping on purpose: this is reachable only from inside the compose network, exactly like
  # the API key it replaces. The browser always talks to same-origin /tts and never to this.
  pocket-tts-fr:
    restart: unless-stopped
    build:
      context: ./docker/pocket-tts
    environment:
      POCKET_TTS_LANGUAGE: french_24l
    volumes:
      - pocket_tts_models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      # First boot downloads ~760 MB of weights before /health answers, hence the long start period.
      start_period: 600s
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pocket_tts_models:
  caddy_data:
  caddy_config:
