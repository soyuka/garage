framework:
    cache:
        # Both upstream caches live in PostgreSQL via the DBAL adapter, backed by the
        # default Doctrine connection. The Symfony↔Doctrine schema listener makes
        # doctrine:migrations:diff emit the cache_items table from these pools.
        default_doctrine_dbal_provider: doctrine.dbal.default_connection

        pools:
            # Paid upstream HTTP responses — immutable facts about a vehicle, so the pool
            # default never expires (default_lifetime: 0). The exception is the partsapi
            # catalog snapshot (getArticles/getSearchTree): PartsApiClient sets a per-item
            # TTL from PARTSAPI_CATALOG_TTL because the upstream data is refreshed quarterly.
            cache.siv:
                adapter: cache.adapter.doctrine_dbal
                default_lifetime: 0
            cache.partsapi:
                adapter: cache.adapter.doctrine_dbal
                default_lifetime: 0
            # Motul Oil Advisor responses (search + SSR recommendations) — a vehicle's
            # recommended grade is stable, so cache forever and stay polite to the upstream.
            cache.motul:
                adapter: cache.adapter.doctrine_dbal
                default_lifetime: 0
