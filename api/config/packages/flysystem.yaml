# Bills and vehicle documents sit behind a `lazy` storage that picks its backend from
# STORAGE_ADAPTER: `local` (default, files under var/storage, nothing to run) or `s3` (any
# S3-compatible bucket through the async-aws client `maintenance.s3_client`, services.yaml).
flysystem:
    storages:
        maintenance.local:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/var/storage/maintenance-bills'
        maintenance.s3:
            adapter: 'asyncaws'
            options:
                client: 'maintenance.s3_client'
                bucket: '%env(S3_BUCKET)%'
                prefix: 'maintenance-bills'
        maintenance.storage:
            adapter: 'lazy'
            options:
                source: 'maintenance.%env(STORAGE_ADAPTER)%'

        vehicle_documents.local:
            adapter: 'local'
            options:
                directory: '%kernel.project_dir%/var/storage/vehicle-documents'
        vehicle_documents.s3:
            adapter: 'asyncaws'
            options:
                client: 'maintenance.s3_client'
                bucket: '%env(S3_BUCKET)%'
                prefix: 'vehicle-documents'
        vehicle_documents.storage:
            adapter: 'lazy'
            options:
                source: 'vehicle_documents.%env(STORAGE_ADAPTER)%'

# The suite writes under the cache dir, which is disposable, so stored test bytes never leak
# between runs or into var/storage.
when@test:
    flysystem:
        storages:
            maintenance.local:
                adapter: 'local'
                options:
                    directory: '%kernel.cache_dir%/maintenance-storage'
            vehicle_documents.local:
                adapter: 'local'
                options:
                    directory: '%kernel.cache_dir%/vehicle-documents-storage'
