doctrine:
    dbal:
        # DBAL stays only for the Messenger transports (doctrine://) and for app:cache:migrate-to-mongo,
        # which reads the retired cache_items table — the domain model and the upstream response stores
        # live in MongoDB (config/packages/doctrine_mongodb.yaml). No ORM is configured.
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
