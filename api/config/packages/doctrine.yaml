doctrine:
    dbal:
        # DBAL stays only for the upstream HTTP caches (cache.siv, cache.partsapi) — the domain
        # model lives in MongoDB (config/packages/doctrine_mongodb.yaml). No ORM is configured.
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'
