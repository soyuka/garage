security:
    providers:
        # Provisions users from validated Casdoor access-token claims (find-or-create on `sub`).
        zitadel:
            id: App\Security\ZitadelUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # RFC 9728 metadata must stay public: a client holding a stale token has to read it
        # to discover the authorization server before it can refresh.
        oauth_metadata:
            pattern: ^/\.well-known/oauth-protected-resource$
            security: false

        # The MCP endpoint is OAuth-protected. The access_token handler is added per
        # environment below so the test env can swap the cryptographic handler for a stub
        # (declaring it here too would trip the "multiple token handlers" config check).
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: zitadel

        # The finder's public catalogue reads (vehicles, vins, cars) stay anonymous; the bearer is only
        # read so an authenticated finder search can be journaled under its owner
        # (App\Finder\FinderSearchJournalListener). A missing, invalid or expired token is treated as
        # anonymous (App\Security\LenientAccessTokenAuthenticator) — a stale dashboard token must not
        # break a public read. Same Casdoor handler as `api` (added per environment below).
        catalog:
            pattern: ^/(vehicles|vins|cars)
            stateless: true
            provider: zitadel

        # The REST garage surface + the agent turn. The token is OPTIONAL at the firewall (a request
        # with no token falls through as anonymous so the public garage GETs still work); the
        # access_control rules below force one on the write methods and on /agent/turn, and an invalid
        # token is a strict 401 here.
        api:
            pattern: ^/(garage|agent|tts|stt|registration-documents|photo-intake)
            stateless: true
            provider: zitadel

        # Everything else (the public /api reference data, docs) stays open.
        main:
            security: false

    access_control:
        # Force a 401 (entry point) for unauthenticated /mcp calls; without this the missing
        # token would simply fall through as anonymous and the tools would run unprotected.
        - { path: ^/mcp, roles: IS_AUTHENTICATED_FULLY }
        # Garage WRITES require a token; GET stays anonymous (reads + Mercure are still public —
        # the latent multi-tenant cluster is the next step). /agent/turn is gated wholesale.
        - { path: ^/garage, methods: [POST, PUT, PATCH, DELETE], roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/agent/turn, roles: IS_AUTHENTICATED_FULLY }
        # The pilot topic is the only thing keeping one owner's render intents off another's
        # EventSource (the hub takes anonymous subscribers), so handing it out needs a token.
        - { path: ^/agent/link, roles: IS_AUTHENTICATED_FULLY }
        # /tts spends real vendor credits with a server-side key. Authentication is the whole gate;
        # an open proxy is somebody else's money (docs/voice-plan.md § Phase 1).
        - { path: ^/tts, roles: IS_AUTHENTICATED_FULLY }
        # /stt spends this machine's CPU on a speech model. Same reasoning, harsher bill: an open
        # transcription proxy is a free GPU-less ASR service for strangers (docs/dictation-plan.md).
        - { path: ^/stt, roles: IS_AUTHENTICATED_FULLY }
        # /registration-documents sends the upload to a paid vision model: same open-proxy reasoning.
        - { path: ^/registration-documents, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/photo-intake, roles: IS_AUTHENTICATED_FULLY }

# Tokens are validated locally against Casdoor's JWKS. CasdoorTokenHandler mirrors the OIDC
# handler but drops the audience check, because Casdoor sets `aud` to the (per-DCR dynamic)
# client_id and ignores RFC 8707 — so a stable audience cannot be pinned. See the class docblock.
when@dev: &casdoor_firewall
    security:
        firewalls:
            mcp:
                access_token:
                    token_handler: App\Security\CasdoorTokenHandler
            api:
                access_token:
                    token_handler: App\Security\CasdoorTokenHandler
            catalog:
                access_token:
                    token_handler: App\Security\CasdoorTokenHandler

when@prod: *casdoor_firewall

when@test:
    security:
        firewalls:
            mcp:
                access_token:
                    # A real Casdoor-signed JWT cannot be minted offline, so tests decode
                    # opaque test tokens instead. The firewall and ZitadelUserProvider still
                    # run for real.
                    token_handler: App\Tests\Security\FakeOidcTokenHandler
            api:
                access_token:
                    token_handler: App\Tests\Security\FakeOidcTokenHandler
            catalog:
                access_token:
                    token_handler: App\Tests\Security\FakeOidcTokenHandler
