security:
    providers:
        # Provisions users from validated Casdoor access-token claims (find-or-create on `sub`).
        zitadel:
            id: App\Security\ZitadelUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # RFC 9728 metadata must stay public: a client holding a stale token has to read it
        # to discover the authorization server before it can refresh.
        oauth_metadata:
            pattern: ^/\.well-known/oauth-protected-resource$
            security: false

        # The MCP endpoint is OAuth-protected: a token must carry this server's resource URI in `aud`
        # (App\Security\AudienceTokenHandler). The test env swaps only the signature verifier behind it.
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: zitadel
            access_token:
                token_handler: app.access_token.mcp

        # Everything else is deny-by-default: the REST garage, the agent, the speech and upload
        # endpoints, and every catalogue read (plate lookup, /cars, narrowing), which proxy to bonneref
        # with the caller's own bearer. The API reference (/docs, entrypoint, contexts) is gated too.
        # The bearer is validated here, so an invalid or expired token is a strict 401
        # (App\Security\CasdoorTokenHandler); a token-less request gets 401 + `WWW-Authenticate: Bearer`
        # from App\Security\BearerEntryPoint.
        api:
            pattern: ^/
            stateless: true
            provider: zitadel
            entry_point: App\Security\BearerEntryPoint
            access_token:
                token_handler: app.access_token.api

    access_control:
        # Force a 401 (entry point) for unauthenticated /mcp calls; without this the missing
        # token would simply fall through as anonymous and the tools would run unprotected.
        # (The challenge also carries the RFC 9728 resource_metadata, McpProtectedResourceChallengeListener.)
        - { path: ^/mcp, roles: IS_AUTHENTICATED_FULLY }
        # Deny by default: every path not opened by a firewall above needs a token. The pilot topic
        # (/agent/link) is the only thing keeping one owner's render intents off another's EventSource
        # (the Mercure hub takes anonymous subscribers), /tts and /stt spend vendor credits or CPU, and
        # the garage is owner-scoped: all of them rely on this rule rather than on a per-route entry.
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
