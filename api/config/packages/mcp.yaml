mcp:
    servers:
        # The key names the server; `name` is what clients actually see.
        garage:
            name: 'mon-parc-auto'
            version: '0.1.0'
            description: 'French vehicle parts catalog and a personal vehicle garage. Look up parts and articles from TecDoc by registration plate (plaque d''immatriculation) or brand; and save, track and forecast maintenance for any vehicle you own.'
            instructions: >-
                This server has two sides: a read-only TecDoc catalog, and a writable personal garage.

                CATALOG (read): start with lookup_plate to resolve a French registration plate into
                vehicle information including its TecDoc carId (kType) and carType (PC, CV or MC for a motorbike). Then use
                list_part_categories and list_articles with that carId. Alternatively
                browse by brand with list_makes, list_models and list_cars.

                GARAGE (read + write): the user keeps their own vehicles here. To plan intended work use
                plan_maintenance — it carries the parts (the shopping list). To record facts about a vehicle
                (oil type/capacity, part reference, paint code, build date, tyre size...) use
                set_vehicle_facts, addressed by the vehicle @id; remove_vehicle_facts retracts one. To
                record a dated service event use log_maintenance. plan_maintenance and log_maintenance
                create the vehicle on first write, so you never need a separate "create vehicle" step.
                Inspect with list_vehicles, get_vehicle_facts (a projection of catalog specs, logged
                parts and recorded facts), get_maintenance_history and forecast with list_due_maintenance.

                AVOID DUPLICATES: before writing, call list_vehicles to see what already exists — the same
                machine is often known under another label (e.g. a TORO and a Wheel Horse 246-H are one
                mower). If plan_maintenance or log_maintenance returns an "ambiguous_match" error, do NOT
                retry blindly: inspect the candidates, then re-call with vehicleId set to the matching one
                to update it, or confirmNew:true only if it is genuinely a different vehicle. Pass
                carId/plate/vin whenever known so the same vehicle is recognised next time.

                IMPORTANT: the garage accepts ANY vehicle, including ones absent from TecDoc — lawn
                tractors, motorcycles, generators, imports without a French plate. A catalog miss
                (not_in_catalog) is a normal outcome, not an error: fall back to plan_maintenance with the
                spec recorded with set_vehicle_facts, sourced from documentation or web lookup. Never refuse to
                save a vehicle just because it is not in the parts catalog.
            transports:
                stdio: false
                http: true
            http:
                path: '%app.mcp_path%'
                # 0.14 made the DNS-rebinding allowlist a bundle option, so the endpoint no longer
                # needs a hand-written controller to accept a public hostname.
                allowed_hosts: '%env(csv:MCP_ALLOWED_HOSTS)%'
            session:
                store: 'file'
                directory: '%kernel.cache_dir%/mcp-sessions'
                ttl: 3600
            # API Platform contributes the garage tools; McpToolbox::EXCLUDED still hides the pilot ones.
            registry: '*'
