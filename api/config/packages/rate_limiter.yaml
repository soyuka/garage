framework:
    rate_limiter:
        # In-app agent turns spend our Anthropic credits; MCP calls do not (the caller's own model
        # reasons), so only POST /agent/turn consumes this. Keyed on the owner (Casdoor email).
        agent_turn:
            policy: sliding_window
            limit: '%env(int:AGENT_TURN_RATE_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # Same endpoint, one key for everyone: the spend ceiling however many accounts sign up.
        agent_turn_global:
            policy: sliding_window
            limit: '%env(int:AGENT_TURN_GLOBAL_RATE_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # The rest are keyed on the owner too (OwnerRateLimit).
        speech:
            policy: sliding_window
            limit: '%env(int:SPEECH_RATE_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        transcription:
            policy: sliding_window
            limit: '%env(int:TRANSCRIPTION_RATE_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # One key for everyone, consumed once the owner's slot is: the vendor ceiling however many
        # accounts sign up (ElevenLabs bills a monthly character budget).
        speech_global:
            policy: sliding_window
            limit: '%env(int:SPEECH_GLOBAL_RATE_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        transcription_global:
            policy: sliding_window
            limit: '%env(int:TRANSCRIPTION_GLOBAL_RATE_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # get_motul_oil scrapes motul.com; MCP and in-app calls alike, keyed on the owner.
        motul:
            policy: sliding_window
            limit: '%env(int:MOTUL_RATE_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # Vehicle documents and maintenance bills share one budget: both write to the object store.
        upload:
            policy: sliding_window
            limit: '%env(int:UPLOAD_RATE_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # Bills, documents and turn attachments across ALL owners: the object-store write ceiling.
        upload_global:
            policy: sliding_window
            limit: '%env(int:UPLOAD_GLOBAL_RATE_LIMIT)%'
            interval: '1 hour'
            cache_pool: cache.rate_limiter

    cache:
        pools:
            cache.rate_limiter:
                adapter: cache.app

when@test:
    framework:
        cache:
            pools:
                # cache.app is a filesystem pool that outlives the kernel, so every functional test
                # posting as TEST_OWNER would share one budget across the whole run.
                cache.rate_limiter:
                    adapter: cache.adapter.array
