# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # The token claim that identifies a tenant. NOT `sub`: Casdoor mints a fresh uuid for the
    # built-in `admin` user every time it re-applies init_data.json, so a sub-keyed owner loses the
    # whole garage on a restart (verified 2026-09-19). The email is the stable seam across reseeds.
    app.owner_claim: 'email'
    # One source of truth: config/packages/mcp.yaml routes it, the stream runner replays against it.
    app.mcp_path: '/mcp'

    # PocketTtsSpeechClient::voices() label, when nothing sets the env var at all (never true once
    # api/.env loads, which always sets it — this is the fallback for a stripped-down environment).
    env(POCKET_TTS_VOICE_LABEL): 'Kyutai'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Siv\SivClient:
        arguments:
            $httpClient: '@siv.client'
            $token: '%env(API_PLAQUE_TOKEN)%'
            $cache: '@cache.siv'

    App\PartsApi\PartsApiClient:
        arguments:
            # partsapi.ru issues one key PER method — see docs/PARTSAPI.md
            $keys:
                getMakes: '%env(PARTSAPI_KEY_getMakes)%'
                getModels: '%env(PARTSAPI_KEY_getModels)%'
                getCars: '%env(PARTSAPI_KEY_getCars)%'
                getSearchTree: '%env(PARTSAPI_KEY_getSearchTree)%'
                getArticles: '%env(PARTSAPI_KEY_getArticles)%'
                GetFillVolumes: '%env(PARTSAPI_KEY_GetFillVolumes)%'
                getArticleCrosses: '%env(PARTSAPI_KEY_getArticleCrosses)%'
                getArticleCriteria: '%env(PARTSAPI_KEY_getArticleCriteria)%'
            $cache: '@cache.partsapi'
            $catalogTtl: '%env(int:PARTSAPI_CATALOG_TTL)%'

    App\Catalog\PartsCatalog:
        arguments:
            # partsapi language id for group/article names (6 = Français, 4 = English GB)
            $lang: '%env(int:PARTSAPI_LANG)%'

    App\Motul\MotulClient:
        arguments:
            $cache: '@cache.motul'
            $locale: '%env(MOTUL_LOCALE)%'
            $bu: '%env(MOTUL_BU)%'

    # In-process MCP bridge: drives the same Server the /mcp endpoint uses (service id mcp.server.garage,
    # not autowireable by FQCN), so the agent reuses the garage tools without HTTP/OAuth.
    App\Mcp\Agent\McpToolbox:
        arguments:
            $server: '@mcp.server.garage'

    # Web-search mechanism follows the agent's platform (anthropic|qwen|off) — see
    # config/packages/ai.yaml + docs/AGENT_PROVIDER.md.
    App\Agent\WebSearchInputProcessor:
        arguments:
            $provider: '%env(enum:App\Agent\WebSearchProvider:AGENT_WEB_SEARCH)%'

    # Merge the garage MCP tools into the garage agent's #[AsTool] toolbox (render intents). The
    # bundle wires one toolbox per agent; this decorator (default priority 0) sits INSIDE the
    # bundle's FaultTolerantToolbox (priority -1024, outermost), so malformed tool calls from either
    # family surface as error tool-results to the model instead of bubbling to a 500.
    App\Agent\Toolbox\CompositeToolbox:
        decorates: ai.toolbox.garage
        arguments:
            $renderToolbox: '@.inner'
            $mcpToolbox: '@App\Mcp\Agent\McpToolbox'
            $narrator: '@App\Agent\Ui\StepNarrator'

    # The finder agent (ai.yaml `finder`): its render tools stay out of the `ai.tool` tag so the garage
    # agent's `tools: true` never picks them up; the finder lists this service explicitly instead.
    App\Agent\Finder\FinderRenderTools:
        autoconfigure: false

    # The catalogue READ tools only — an allowlist, so a new garage write tool can never reach the finder.
    app.finder.mcp_toolbox:
        class: App\Mcp\Agent\McpToolbox
        arguments:
            $server: '@mcp.server.garage'
            $only: ['lookup_plate', 'decode_vin', 'list_part_categories', 'get_service_parts']

    app.finder.composite_toolbox:
        class: App\Agent\Toolbox\CompositeToolbox
        decorates: ai.toolbox.finder
        arguments:
            $renderToolbox: '@.inner'
            $mcpToolbox: '@app.finder.mcp_toolbox'
            $narrator: '@App\Agent\Ui\StepNarrator'

    # Log Anthropic server-side tool use (web_search) per call. Decorates the platform the garage
    # agent runs on: server tools leave no Toolbox call or domain write, so the platform's raw
    # response is the only place their use is observable. The decorated platform is a lazy proxy
    # (AiBundle marks ai.platform.anthropic lazy + proxy), so this decorator must be lazy and carry
    # the same proxy interface — otherwise the inner profiler decorator (TraceablePlatform) ends up
    # with a proxy tag but no lazy flag and the container fails to compile.
    App\Agent\ServerToolUseLogger:
        decorates: ai.platform.anthropic
        # Name the undecorated platform so the out-of-band web-search client can reach Anthropic
        # WITHOUT this logger — routing the side call through here would double-feed the turn's
        # WebSearchBudget (the tool already records it) and overwrite the journal's live model.
        decoration_inner_name: 'App\Agent\ServerToolUseLogger.inner'
        lazy: true
        tags:
            - { name: proxy, interface: Symfony\AI\Platform\PlatformInterface }
        arguments:
            $inner: '@.inner'

    # Out-of-band web search: a focused side call behind the provider-agnostic WebSearchClient seam so
    # the orchestrator (any model) borrows real grounding. Two backends; WEB_SEARCH_BACKEND selects one.
    # Anthropic: Haiku + native web_search. Uses the UNDECORATED anthropic platform (.inner) — routing
    # through ServerToolUseLogger would double-feed the turn's WebSearchBudget and clobber the journal.
    App\Agent\WebSearch\AnthropicWebSearchClient:
        arguments:
            $platform: '@App\Agent\ServerToolUseLogger.inner'
            $model: '%env(WEB_SEARCH_MODEL)%'

    # Carte grise extraction: one-shot Sonnet 5.5 vision call on the UNDECORATED Anthropic platform, so
    # the upload never reaches ServerToolUseLogger / the turn journal.
    App\RegistrationDocument\AnthropicRegistrationDocumentReader:
        arguments:
            $platform: '@App\Agent\ServerToolUseLogger.inner'
            $model: 'claude-sonnet-5-5?max_tokens=2048'

    App\RegistrationDocument\RegistrationDocumentReader:
        alias: App\RegistrationDocument\AnthropicRegistrationDocumentReader

    # Gemini: Gemini + Google Search grounding. Plain ai.platform.gemini (no decorator on it).
    App\Agent\WebSearch\GeminiWebSearchClient:
        arguments:
            $platform: '@ai.platform.gemini'
            $model: '%env(GEMINI_WEB_SEARCH_MODEL)%'
            # Trace the raw Gemini body onto the turn journal so an empty answer is diagnosable.
            $tracer: '@App\Agent\Journal\TurnJournal'

    # The seam the WebSearchTool depends on: a runtime router picking the backend from WEB_SEARCH_BACKEND.
    # Service locator so only the selected backend's (lazy) platform is ever instantiated.
    App\Agent\WebSearch\WebSearchClient:
        class: App\Agent\WebSearch\SelectableWebSearchClient
        arguments:
            $clients: !service_locator
                anthropic: '@App\Agent\WebSearch\AnthropicWebSearchClient'
                gemini: '@App\Agent\WebSearch\GeminiWebSearchClient'
            $backend: '%env(enum:App\Agent\WebSearch\WebSearchBackend:WEB_SEARCH_BACKEND)%'

    # The voice (docs/voice-plan.md). Deliberately the SAME shape as the WebSearchClient seam above —
    # runtime router over a !service_locator — so only the selected backend is instantiated and the
    # unused provider never demands an API key. A Google Chirp 3 HD client drops in as one class, one
    # enum case and one line here.
    App\Speech\ElevenLabsSpeechClient:
        arguments:
            $apiKey: '%env(ELEVENLABS_API_KEY)%'
            $voiceId: '%env(ELEVENLABS_VOICE_ID)%'
            $model: '%env(ELEVENLABS_MODEL)%'
            $speed: '%env(float:ELEVENLABS_SPEED)%'

    # One `pocket-tts serve` per language: the model is bound at process start, so a locale with no
    # server configured stays mute rather than borrowing another language's phonetics.
    App\Speech\PocketTtsSpeechClient:
        arguments:
            $endpoints:
                fr: '%env(POCKET_TTS_FR_URL)%'
                en: '%env(POCKET_TTS_EN_URL)%'
            $voiceLabel: '%env(POCKET_TTS_VOICE_LABEL)%'

    # The disk cache (docs/voice-plan.md § Phase 2): a hit makes zero calls to the backend. Wraps
    # EACH backend individually, not the routed SpeechClient below — only here is the model/voice
    # identifying the coming audio a compile-time value, so the decorator itself never has to know
    # which backend is live. `abstract: true` keeps the App\: resource glob from also trying (and
    # failing) to autowire this class's scalar constructor arguments on its own.
    App\Speech\CachingSpeechClient:
        abstract: true

    speech.caching.elevenlabs:
        class: App\Speech\CachingSpeechClient
        arguments:
            $inner: '@App\Speech\ElevenLabsSpeechClient'
            $backend: 'elevenlabs'
            $model: '%env(ELEVENLABS_MODEL)%'
            $voice: '%env(ELEVENLABS_VOICE_ID)%'
            $speed: '%env(float:ELEVENLABS_SPEED)%'
            # Namespaced per environment — a shared path let the test suite's fake voice list
            # (docs/voice-plan.md § Phase 2 note, defect 2026-09-06) leak into the live cache.
            $cacheDir: '%kernel.project_dir%/var/tts/%kernel.environment%'

    speech.caching.pockettts:
        class: App\Speech\CachingSpeechClient
        arguments:
            $inner: '@App\Speech\PocketTtsSpeechClient'
            $backend: 'pockettts'
            # pocket-tts serve exposes no separate model/voice choice — one Kyutai model per locale
            # IS the whole identity — so these are fixed labels, not read from env.
            $model: 'kyutai-pocket-tts'
            $voice: ''
            $speed: 1.0
            $cacheDir: '%kernel.project_dir%/var/tts/%kernel.environment%'

    App\Speech\SpeechClient:
        class: App\Speech\SelectableSpeechClient
        arguments:
            $clients: !service_locator
                elevenlabs: '@speech.caching.elevenlabs'
                pockettts: '@speech.caching.pockettts'
            $backend: '%env(enum:App\Speech\SpeechBackend:TTS_BACKEND)%'

    # The ear (docs/dictation-plan.md). The SAME seam shape as the voice above — router over a
    # !service_locator — so a local whisper sidecar drops in later as one class, one enum case and one
    # line here. No caching decorator on this side on purpose: two recordings are never byte-identical,
    # so a cache would be a disk full of single-use entries.
    App\Transcription\ElevenLabsTranscriptionClient:
        arguments:
            $apiKey: '%env(ELEVENLABS_API_KEY)%'
            $model: '%env(ELEVENLABS_STT_MODEL)%'

    App\Transcription\TranscriptionClient:
        class: App\Transcription\SelectableTranscriptionClient
        arguments:
            $clients: !service_locator
                elevenlabs: '@App\Transcription\ElevenLabsTranscriptionClient'
            $backend: '%env(enum:App\Transcription\TranscriptionBackend:STT_BACKEND)%'

    # Qwen counterpart: record the live model on the debug journal off each call.
    # Same lazy+proxy contract as above — the generic platform is wired lazy+proxy by AiBundle.
    App\Agent\QwenModelLogger:
        decorates: ai.platform.generic.qwen
        lazy: true
        tags:
            - { name: proxy, interface: Symfony\AI\Platform\PlatformInterface }
        arguments:
            $inner: '@.inner'

    App\Command\ImportLegacyCacheCommand:
        arguments:
            $sivCache: '@cache.siv'
            $partsApiCache: '@cache.partsapi'

    # The S3-compatible client backing the maintenance-bills Flysystem storage (config/packages/
    # flysystem.yaml). pathStyleEndpoint is required for MinIO and other non-AWS S3 servers, which
    # serve buckets as a path segment (host/bucket/key) rather than a vhost (bucket.host/key). In
    # the test env the storage swaps to a local adapter, so this client is never instantiated there.
    maintenance.s3_client:
        class: AsyncAws\S3\S3Client
        arguments:
            $configuration:
                endpoint: '%env(S3_ENDPOINT)%'
                accessKeyId: '%env(S3_ACCESS_KEY)%'
                accessKeySecret: '%env(S3_SECRET_KEY)%'
                region: '%env(S3_REGION)%'
                pathStyleEndpoint: true

    # Bind the named Flysystem storage explicitly: the bundle's argument alias camelises the
    # dotted storage name into something unusable ($maintenance_Storage), so reference the
    # storage service id directly instead.
    App\Storage\MaintenanceAttachmentStorage:
        arguments:
            $filesystem: '@maintenance.storage'

    App\Storage\VehicleDocumentStorage:
        arguments:
            $filesystem: '@vehicle_documents.storage'

    # Validates Casdoor JWTs for the /mcp firewall (dev/prod). Audience is intentionally
    # unpinned — see the class docblock. JWKS discovered from CASDOOR_ISSUER, cached in cache.app.
    App\Security\CasdoorTokenHandler:
        arguments:
            $discoveryCache: '@cache.app'
            $oidcConfigurationCacheKey: 'casdoor_oidc_config'
            $issuers: ['%env(CASDOOR_ISSUER)%']
            $claim: '%app.owner_claim%'


when@test:
    services:
        # Back to the plain client: `siv.client` is a scoped RetryableHttpClient, and a test must
        # never be one wiring slip away from billing the real SIV API.
        App\Siv\SivClient:
            arguments:
                $httpClient: '@http_client'
                $token: '%env(API_PLAQUE_TOKEN)%'
                $cache: '@cache.siv'
                $retryDelayMs: 0

        App\Tests\Mock\FixtureHttpClient:
            decorates: http_client
            arguments:
                $fixturesDir: '%kernel.project_dir%/tests/Fixtures'

        # Decodes opaque test tokens in place of the cryptographic OidcTokenHandler. Reads the same
        # claim as production so the suite covers the tenancy key, not a hardcoded `sub`.
        App\Tests\Security\FakeOidcTokenHandler:
            arguments:
                $claim: '%app.owner_claim%'

        # The vendor TTS transport. Its own double rather than FixtureHttpClient because the speech
        # tests assert on the OUTGOING request (key header, voice in the path, model in the body).
        App\Tests\Mock\RecordingSpeechHttpClient:
            public: true

        App\Speech\ElevenLabsSpeechClient:
            arguments:
                $http: '@App\Tests\Mock\RecordingSpeechHttpClient'
                $apiKey: '%env(ELEVENLABS_API_KEY)%'
                $voiceId: '%env(ELEVENLABS_VOICE_ID)%'
                $model: '%env(ELEVENLABS_MODEL)%'
                $speed: '%env(float:ELEVENLABS_SPEED)%'

        # The vendor STT transport. Its own double, same reasoning as the TTS one: these tests assert
        # on the OUTGOING request — that the recording arrives byte for byte and carries the resolved
        # language — which a fixture-file router cannot express.
        App\Tests\Mock\RecordingTranscriptionHttpClient:
            public: true

        App\Transcription\ElevenLabsTranscriptionClient:
            arguments:
                $http: '@App\Tests\Mock\RecordingTranscriptionHttpClient'
                $apiKey: '%env(ELEVENLABS_API_KEY)%'
                $model: '%env(ELEVENLABS_STT_MODEL)%'

        # The model call is never made in tests: the endpoint talks to a scripted reader.
        App\Tests\Mock\FakeRegistrationDocumentReader:
            public: true

        App\RegistrationDocument\RegistrationDocumentReader:
            alias: App\Tests\Mock\FakeRegistrationDocumentReader
            public: true

        # A default tenant for the suite: garage reads that send no token resolve to the same owner
        # the tests seed under (App\Tests\Functional\AppTestCase::TEST_OWNER). Prod leaves this null.
        App\Security\OwnerContext:
            autowire: true
            arguments:
                # Must equal AppTestCase::TEST_OWNER. Since 55bf873 the owner IS the email claim,
                # so it is an address, not the sub.
                $fallback: 'dashboard@example.com'

        # Capture Mercure publishes (no HTTP) so tests can assert streamed intents/events.
        App\Tests\Mock\RecordingHub:
            decorates: mercure.hub.default
            public: true
