# Source de vérité des fiches "savoir constructeur" PSA (Peugeot, Citroën, DS), vérifiées le 2026-10-14.
# Synchronisé en base par `bin/console app:make-knowledge:sync` (upsert par makes+topic, supprime ce qui disparaît d'ici).
entries:
  - makes: [PEUGEOT, CITROËN, DS]
    topic: numero-organisation
    title: Numéro d'organisation (OPR) PSA et date de fabrication
    verified: true
    body: |
      Le numéro d'organisation (OPR, parfois appelé RPO) est un compteur de jours de production PSA :
      date = 1976-11-08 + OPR jours (OPR 00001 = 1976-11-09). Il comporte 5 chiffres, le zéro de tête est
      souvent omis (9256 = 09256).

      Repères vérifiés : 9256 = 2002-03-13 ; 7969 = 1998-09-03 ; 8701 = 2000-09-04 ; 10006 = 2004-04-01 ;
      10310 = 2005-01-30 ; 10311 = 2005-01-31 ; 10537 = 2005-09-14.

      Les catalogues de pièces (TecDoc, partsapi.ru) découpent les références sur ce numéro : « jusqu'à n°
      d'organisation 10310 / à partir de 10311 ». Pour choisir la bonne pièce, décoder le code de la voiture
      (outil decode_build_code) et le comparer au seuil du catalogue ; le seuil lui-même se convertit en date
      avec le même outil.

      Réserve : un intervenant du forum Peugeot soutient que la date obtenue est la date de commande de la
      voiture et non sa date de fabrication ; à quelques jours près, donc, et à vérifier si le choix de la
      pièce se joue sur un seuil très proche.
    sources:
      - url: https://www.forum-peugeot.com/Forum/threads/que-signifie-le-opr-le-dam-et-le-apv-pr-dun-v%C3%A9hicule.7579/
        label: Forum Peugeot — Que signifie le OPR, le DAM et le APV/PR d'un véhicule
        verified: true
      - url: https://www.forum-peugeot.com/Forum/threads/num%C3%A9ro-opr.71837/latest
        label: Forum Peugeot — Numéro OPR
        verified: true
      - url: https://www.forum-peugeot.com/Forum/threads/num%C3%A9ro-dorganisation-svp.52633/latest
        label: Forum Peugeot — Numéro d'organisation svp
        verified: true
      - url: https://www.forum-peugeot.com/Forum/threads/date-de-fabrication-de-la-voiture.77502/latest
        label: Forum Peugeot — Date de fabrication de la voiture
        verified: true
      - url: https://www.forum-peugeot.com/Forum/threads/date-de-fabrication-de-ma-307.55611/latest
