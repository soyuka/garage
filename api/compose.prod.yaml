---
# Production environment override. Every secret fails closed: compose.yaml's defaults are public
# (!ChangeMe!, !ChangeThisMercureHubJWTSecretKey!), so a missing variable aborts `up` instead of
# booting with one of them.
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment: &prod_secrets
      APP_SECRET: ${APP_SECRET:?APP_SECRET required}
      CASDOOR_ORGANIZATION: ${CASDOOR_ORGANIZATION:?CASDOOR_ORGANIZATION required}
      MPA_SERVICE_CLIENT_ID: ${MPA_SERVICE_CLIENT_ID:-466fc97138f0f6348ec3}
      MPA_SERVICE_CLIENT_SECRET: ${MPA_SERVICE_CLIENT_SECRET:?MPA_SERVICE_CLIENT_SECRET required}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET required}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_SUBSCRIBER_JWT_SECRET:-${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET required}}
      MERCURE_SUBSCRIBER_JWT_SECRET: ${CADDY_MERCURE_SUBSCRIBER_JWT_SECRET:-${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET required}}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:?CADDY_MERCURE_JWT_SECRET required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=${POSTGRES_CHARSET:-utf8}

  worker:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment: *prod_secrets

  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
