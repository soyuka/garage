name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Mirrors the FrankenPHP image (api/Dockerfile, bonneref/api/Dockerfile: dunglas/frankenphp:*-php8.5).
  PHP_VERSION: '8.5'
  PHP_EXTENSIONS: apcu, gmp, intl, mongodb, pdo_pgsql, pdo_sqlite, zip
  # bonneref tests use the Web Storage globals Node ships unflagged since 25.
  NODE_VERSION: '26'

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      bonneref-api: ${{ steps.filter.outputs.bonneref-api }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      bonneref-front: ${{ steps.filter.outputs.bonneref-front }}
    steps:
      # Credentials kept on this one checkout: on a push, paths-filter `git fetch`es the pushed range
      # from this private repo. The job token is read-only and nothing else runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/ci.yml'
            api:
              - *workflow
              - 'api/**'
            bonneref-api:
              - *workflow
              - 'bonneref/api/**'
            dashboard:
              - *workflow
              - 'dashboard/**'
            bonneref-front:
              - *workflow
              - 'bonneref/src/**'
              - 'bonneref/public/**'
              - 'bonneref/test-fixtures/**'
              - 'bonneref/index.html'
              - 'bonneref/package.json'
              - 'bonneref/package-lock.json'
              - 'bonneref/tsconfig.json'
              - 'bonneref/vite*.config.ts'
              - 'bonneref/.env*'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Messenger's failed transport is doctrine:// and MigrateCacheToMongoCommandTest reads the
      # retired cache_items table. Credentials match DATABASE_URL in api/.env; doctrine.yaml
      # suffixes the database name with _test.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMe!'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -d app_test -U app"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      MONGODB_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # PopplerPdfTextExtractor shells out to pdftotext on document uploads.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: memory_limit=1G, apc.enable_cli=1, upload_max_filesize=50M, post_max_size=52M # api/frankenphp/conf.d/10-app.ini
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          working-directory: api
      - name: PHP CS Fixer
        run: composer cs:check
      # vendor/bin/mago downloads its release binary from GitHub on first run; the token avoids the anonymous rate limit.
      - name: Mago
        run: composer mago
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: PHPUnit
        run: vendor/bin/phpunit

  bonneref-api:
    needs: changes
    if: needs.changes.outputs.bonneref-api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bonneref/api
    # No Postgres: Messenger is in-memory:// and turns run in kernel.terminate (bonneref/api/.env).
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      # bonneref/api/.env points at the dev override's published 27018.
      MONGODB_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # PdfPageCount shells out to pdfinfo on registration document intake.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: memory_limit=1G, apc.enable_cli=1, upload_max_filesize=10M, post_max_size=24M # bonneref/api/frankenphp/conf.d/10-app.ini
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          working-directory: bonneref/api
      - name: PHP CS Fixer
        run: composer cs:check
      # vendor/bin/mago downloads its release binary from GitHub on first run; the token avoids the anonymous rate limit.
      - name: Mago
        run: composer mago
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: PHPUnit
        run: vendor/bin/phpunit

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  bonneref-front:
    needs: changes
    if: needs.changes.outputs.bonneref-front == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bonneref
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: bonneref/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # bonneref.fr serves dist/ at the root, a /bonneref/ base answers every asset with index.html
      - run: "! grep -q '/bonneref/' dist/index.html"
