security:
    providers:
        # Provisions users from validated Casdoor access-token claims (find-or-create on the owner claim).
        casdoor:
            id: App\Security\CasdoorUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # RFC 9728 metadata must stay public: a client holding a stale token has to read it
        # to discover the authorization server before it can refresh.
        oauth_metadata:
            pattern: ^/\.well-known/oauth-protected-resource$
            security: false

        # The MCP endpoint is OAuth-protected: a token must carry this server's resource URI in `aud`
        # (App\Security\AudienceTokenHandler). The test env swaps only the signature verifier behind it.
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: casdoor
            access_token:
                token_handler: app.access_token.mcp

        # The finder's shared link (« Copier le lien ») is opened by someone else, who holds no token;
        # the id is an unguessable ULID (App\Controller\Finder\FinderSelectionController). A
        # firewall of its own, not a PUBLIC_ACCESS rule, so a stale bearer cannot 401 it either.
        public_selection:
            pattern: ^/agent/selections/
            security: false

        # mpa forwards its caller's bearer to the catalogue routes it calls (App\Bonneref\BonnerefClient
        # over there), so these also accept mpa's audiences. Documented debt (api/docs/AUTH.md, FUTURE.md
        # "Token passthrough mpa -> bonneref"): GET only, exactly the routes mpa reaches, never /mcp.
        catalogue_passthrough:
            pattern: ^/(makes(/\d+/models(/\d+/cars)?)?|cars/\d+/part-categories(/\d+/(articles|narrowed))?|vehicles/[^/]+)$
            methods: [GET]
            stateless: true
            provider: casdoor
            entry_point: App\Security\BearerEntryPoint
            access_token:
                token_handler: app.access_token.catalogue_passthrough

        # Everything else is deny-by-default: the agent, the upload endpoints, and every catalogue read
        # (plate/VIN lookup, /cars, narrowing, photos), which spend paid upstream quota (SIV, the model
        # vendor) for whoever calls them. The API reference (/docs,
        # entrypoint, contexts) is gated too. The bearer is validated here, so an invalid or expired
        # token is a strict 401 (App\Security\CasdoorTokenHandler); a token-less request gets
        # 401 + `WWW-Authenticate: Bearer` from App\Security\BearerEntryPoint.
        api:
            pattern: ^/
            stateless: true
            provider: casdoor
            entry_point: App\Security\BearerEntryPoint
            access_token:
                token_handler: app.access_token.api

    access_control:
        # Force a 401 (entry point) for unauthenticated /mcp calls; without this the missing
        # token would simply fall through as anonymous and the tools would run unprotected.
        # (The challenge also carries the RFC 9728 resource_metadata, McpProtectedResourceChallengeListener.)
        - { path: ^/mcp, roles: IS_AUTHENTICATED_FULLY }
        # Deny by default: every path not opened by a firewall above needs a token. /registration-documents
        # and /photo-intake spend vendor credits, and the journal is owner-scoped: all of them rely on this
        # rule rather than on a per-route entry.
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
