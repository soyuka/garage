mercure:
    hubs:
        default:
            url: '%env(default::MERCURE_URL)%'
            public_url: '%env(default::MERCURE_PUBLIC_URL)%'
            # RFC 9068 tokens: typ at+jwt, authorization_details instead of the 0.x `mercure` claim.
            protocol_version: '1.0'
            # One key per role, each the one the hub's `issuer` block (frankenphp/Caddyfile) checks it with.
            # `aud` defaults to public_url (the hub's pinned resource_identifier), plus url on the publisher token.
            publisher:
                secret: '%env(MERCURE_JWT_SECRET)%'
                topics: ['*']
                claims:
                    iss: '%env(MERCURE_JWT_ISSUER)%'
                    sub: 'bonneref'
                    client_id: 'bonneref'
            # Signs the per-session tokens GET /agent/link hands the page (AgentLinkController).
            subscriber:
                secret: '%env(MERCURE_SUBSCRIBER_JWT_KEY)%'
                claims:
                    iss: '%env(MERCURE_JWT_ISSUER)%'
                    sub: 'bonneref'
                    client_id: 'bonneref'
