---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}bonneref-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O; comment to inspect from the host.
      - /app/var
      # The licensed TecDoc catalogue, derived (docs/tecdoc-sqlite.md). Set TECDOC_CATALOG_HOST_PATH in .env.local.
      - ${TECDOC_CATALOG_HOST_PATH:-~/projects/mon-parc-auto.fr/data/catalog-dev.sqlite}:/srv/tecdoc/catalog.sqlite:ro
    environment:
      # No `watch`: the default watcher monitored /app recursively (incl. var/cache), so Symfony's own
      # compiled-container writes triggered worker reboots. Restart manually after code changes:
      # `docker compose restart php`.
      FRANKENPHP_WORKER_CONFIG: ""
      # No `hot_reload` either: it needs a Mercure hub declared in the same Caddy server, and the hub
      # sits on the internal `php:80` site (frankenphp/Caddyfile).
      FRANKENPHP_SITE_CONFIG: ""
      MERCURE_EXTRA_DIRECTIVES: playground
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
      APP_ENV: "${APP_ENV:-dev}"
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  worker:
    image: ${IMAGES_PREFIX:-}bonneref-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - /app/var
      - ${TECDOC_CATALOG_HOST_PATH:-~/projects/mon-parc-auto.fr/data/catalog-dev.sqlite}:/srv/tecdoc/catalog.sqlite:ro
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"

  database:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  mongodb:
    ports:
      - "${MONGODB_PORT:-27018}:27017"
