<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>finder — planche des pièces (dev)</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #fff; color: #222428; font: 500 11.5px/1.2 'IBM Plex Mono', ui-monospace, monospace; }
      h1 { font-size: 11.5px; letter-spacing: 0.04em; margin: 16px 16px 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); border-top: 1px solid #222428; border-left: 1px solid #222428; margin: 12px 16px 20px; }
      figure { margin: 0; min-width: 0; border-right: 1px solid #222428; border-bottom: 1px solid #222428; }
      .cell { height: 190px; }
      @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      figcaption { padding: 6px 8px 7px; border-top: 1px solid #d5d8de; font-size: 10px; overflow-wrap: anywhere; }
      .picto { display: grid; place-items: center; color: #2b59c3; }
      .picto svg { width: 96px; height: 96px; }
      canvas { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./meshes.tsx"></script>
  </body>
